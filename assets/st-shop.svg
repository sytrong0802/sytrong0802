<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" role="img" aria-labelledby="title desc">
<title id="title">ST Shop · Tài khoản AI và Premium</title><desc id="desc">Thẻ thành viên màu cam nổi lên giữa hai vòng sáng. Bấm vào banner để ghé stshop.id.vn.</desc>
<defs>
  <linearGradient id="sky" x2="1" y2=".2"><stop stop-color="#29182c"/><stop offset=".56" stop-color="#482032"/><stop offset="1" stop-color="#2e192f"/></linearGradient>
  <linearGradient id="foil" x2=".85" y2="1"><stop stop-color="#fff4bf"/><stop offset=".4" stop-color="#ffc08d"/><stop offset="1" stop-color="#ef879a"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="white" stop-opacity="0"/><stop offset=".52" stop-color="white" stop-opacity=".64"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect x="-99" y="-61" width="198" height="122" rx="15"/></clipPath>
  <pattern id="grain" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#efc4ae" opacity=".17"/></pattern>
</defs>
<style>
  text{font-family:'Segoe UI',Arial,sans-serif}
  .float{animation:hover 3.6s ease-in-out infinite alternate}
  .gloss{animation:slide 4s ease-in-out infinite}
  .comet{stroke-dasharray:13 87;animation:race 4.4s linear infinite}
  @keyframes hover{from{transform:translateY(7px) rotate(-8deg)}to{transform:translateY(-8px) rotate(1deg)}}
  @keyframes slide{0%,12%{transform:translateX(-180px)}78%,100%{transform:translateX(180px)}}
  @keyframes race{to{stroke-dashoffset:-100}}
  @media(prefers-reduced-motion:reduce){.float,.gloss,.comet{animation:none}.gloss{opacity:0}}
</style>
<rect x="1" y="1" width="938" height="258" rx="20" fill="url(#sky)" stroke="#915469"/>
<rect x="451" y="10" width="478" height="240" rx="15" fill="url(#grain)"/>
<g transform="translate(45 32)">
  <path d="M2 20 13 1h9L11 20zm15 0L28 1h9L26 20z" fill="#ffc295"/>
  <text x="0" y="102" fill="#fff2df" font-size="78" font-weight="750" letter-spacing="-4">ST Shop</text>
  <text x="2" y="142" fill="#f4cacc" font-size="24">Cửa hàng tài khoản AI &amp; Premium</text>
  <rect x="2" y="164" width="190" height="39" rx="19.5" fill="#ffcea4"/>
  <text x="21" y="190" fill="#34202e" font-size="19" font-weight="700">stshop.id.vn</text>
  <path d="m153 190 14-14m-11 0h11v11" stroke="#34202e" fill="none" stroke-width="2.5"/>
</g>
<g transform="translate(700 133)">
  <g transform="rotate(-17)" fill="none"><ellipse rx="176" ry="68" stroke="#a16b84"/><ellipse rx="185" ry="74" stroke="#704b65" stroke-dasharray="2 7"/><ellipse class="comet" rx="176" ry="68" pathLength="100" stroke="#ffd8ad" stroke-width="3"/></g>
  <g transform="rotate(10) translate(9 5)"><rect x="-102" y="-61" width="204" height="122" rx="15" fill="#77506a" stroke="#e9b5d2"/></g>
  <g class="float"><rect x="-99" y="-61" width="198" height="122" rx="15" fill="url(#foil)" stroke="#fff1d3" stroke-width="2"/>
  <g clip-path="url(#card)">
    <g fill="none" stroke="#9e5869" opacity=".46"><circle cx="116" cy="71" r="58"/><circle cx="116" cy="71" r="66"/><circle cx="116" cy="71" r="74"/><circle cx="116" cy="71" r="82"/></g>
    <text x="-80" y="33" font-size="43" font-style="italic" font-weight="800" fill="#472536">ST</text>
    <g transform="translate(-72 -38)" fill="none" stroke="#633a45" stroke-width="2"><rect width="32" height="23" rx="5"/><path d="M10 0v23m11-23v23M0 10h10m11 4h11"/></g>
    <path class="gloss" d="M-30-75h51L-8 75h-51z" fill="url(#shine)"/>
  </g></g>
</g>
</svg>